# ===============================================
# Grade Portal - Production Nginx Configuration
# ===============================================
# Features:
# - HTTPS/SSL termination
# - Security headers
# - Gzip compression
# - Caching strategies
# - Static/media file serving
# - API reverse proxy
# - Frontend SPA support

# Get variables from environment or use defaults
map $http_x_forwarded_proto $proto {
    default $scheme;
    https https;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

upstream django_backend {
    server backend:8000;
    keepalive 32;
}

# Redirect HTTP to HTTPS (for production)
# Uncomment for production deployment
# server {
#     listen 80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$server_name$request_uri;
# }

# Production HTTPS server
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    
    # Keep this for development (http only)
    # To enable in dev: comment out ssl lines above and uncomment http:
    # listen 80;
    # listen [::]:80;

    # SSL certificates (configure for your domain)
    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/yourdomain.com/chain.pem;

    # SSL configuration (for production)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # CSP (Content-Security-Policy)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # Remove server header for security
    server_tokens off;

    # Client upload limit
    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    gzip_comp_level 6;
    gzip_disable "msie6";

    # Logging
    access_log /var/log/nginx/gradeportal_access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/gradeportal_error.log warn;

    # ===== Static Files =====
    location /static/ {
        alias /var/www/gradeportal/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ===== Media Files =====
    location /media/ {
        alias /var/www/gradeportal/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ===== Admin Interface =====
    location /admin/ {
        limit_req zone=general_limit burst=20 nodelay;
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    # ===== API Endpoints =====
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto;
        proxy_set_header Connection "";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Don't redirect
        proxy_redirect off;
    }

    # ===== Frontend SPA =====
    location / {
        root /var/www/gradeportal/frontend;
        
        # Try to serve file first, then directory, then fall back to index.html
        try_files $uri $uri/ /index.html;
        
        # Cache busting for index.html
        location = /index.html {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate, private";
        }
        
        # Cache static assets (JS, CSS with hash in filename)
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Cache images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    # ===== Health Check Endpoint =====
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ===== Deny Access to Sensitive Files =====
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
