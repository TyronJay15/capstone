version: '3.8'

services:
  # ===== MySQL Database =====
  db:
    image: mysql:8.0
    container_name: gradeportal-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gradeportal}
      MYSQL_USER: ${MYSQL_USER:-gradeportal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gradeportal}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/backups:/backups
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gradeportal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Django Backend =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gradeportal-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Django settings
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      DEBUG: ${DEBUG:-False}
      
      # Database configuration
      USE_SQLITE: "false"
      MYSQL_HOST: db
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-gradeportal}
      MYSQL_USER: ${MYSQL_USER:-gradeportal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-gradeportal}
      
      # Server configuration
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      
      # Gunicorn configuration
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
      GUNICORN_BIND: "0.0.0.0:8000"
    expose:
      - "8000"
    volumes:
      - static_files:/var/www/gradeportal/staticfiles
      - media_files:/var/www/gradeportal/media
      - ./backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/enrollment/academic-years/", "||", "exit", "1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - gradeportal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Nginx Reverse Proxy / Web Server =====
  nginx:
    image: nginx:alpine
    container_name: gradeportal-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/gradeportal.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/gradeportal/staticfiles:ro
      - media_files:/var/www/gradeportal/media:ro
      - ./frontend/dist:/var/www/gradeportal/frontend:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - gradeportal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===== Optional: Redis Cache (for future caching layer) =====
  # redis:
  #   image: redis:7-alpine
  #   container_name: gradeportal-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - gradeportal

volumes:
  mysql_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local
  nginx_logs:
    driver: local
  # redis_data:
  #   driver: local

networks:
  gradeportal:
    driver: bridge
